# Static site on Render's free plan. The service name sets the address:
# https://risca-palito.onrender.com. If Render adds a random suffix because the name
# is taken, delete the service and create it again as risca-palito-jogo; never keep an
# address with a code in it.
services:
  - type: web
    name: risca-palito
    runtime: static
    # arcade-hub-ui is a private repository: GITHUB_TOKEN (fine-grained,
    # read-only, only arcade-hub-ui) lets npm fetch it. package-lock.json may
    # record it as https, git+ssh or git@ addresses, so all three are rewritten.
    buildCommand: >-
      git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      && git config --global --add url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      && git config --global --add url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
      && npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SERVER_URL
        value: https://arcade-hub-back.onrender.com
      # Asked for when the Blueprint is created; never commit it.
      - key: GITHUB_TOKEN
        sync: false
