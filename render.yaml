# Static site on Render's free plan. The service name sets the address:
# https://risca-palito.onrender.com. If Render adds a random suffix because the name
# is taken, delete the service and create it again as risca-palito-jogo; never keep an
# address with a code in it.
services:
  - type: web
    name: risca-palito
    runtime: static
    # arcade-hub-ui is a public repository: npm fetches it over HTTPS, no token needed.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SERVER_URL
        value: https://arcade-hub-back.onrender.com
